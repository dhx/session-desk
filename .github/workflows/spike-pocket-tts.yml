# Spike, not product CI: measures Kyutai Pocket TTS on an x86 runner and checks that a voice state
# cloned with the gated model loads into the open model without voice cloning. Lives on the
# spike/pocket-tts branch only and goes away with it.
#
# The voice prompt is private: it comes in as a secret, and everything derived from it (states,
# samples) leaves the job only encrypted to an age key held outside GitHub. Numbers come out as
# annotations.
name: spike pocket-tts

on:
  push:
    branches: [spike/pocket-tts]
    paths: [.github/workflows/spike-pocket-tts.yml, spike/pocket-tts/**]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Recipient only; the identity never leaves the evaluating session.
      AGE_RECIPIENT: age1uxv0dt9rf2089jtgt992e5f0an6pwkgpgnyejll4gqyj5valfa9qpfk20f
    defaults:
      run:
        working-directory: spike/pocket-tts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Machine
        run: |
          echo "::notice title=machine::$(nproc) vCPU, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs), $(free -m | awk '/Mem:/{print $2}') MB"

      - name: Install
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pocket-tts==4.0.1
          sudo apt-get install -y -qq age ffmpeg > /dev/null
          echo "::notice title=versions::$("$RUNNER_TEMP/venv/bin/pip" show pocket-tts torch | grep -E '^(Name|Version)' | paste -sd' ')"

      - name: Voice prompt (private)
        env:
          VOICE_PROMPT_OPUS: ${{ secrets.VOICE_PROMPT_OPUS }}
        run: |
          test -n "$VOICE_PROMPT_OPUS" || { echo "::error::secret VOICE_PROMPT_OPUS is missing"; exit 1; }
          printf %s "$VOICE_PROMPT_OPUS" | base64 -d > prompt.opus
          ffmpeg -v error -y -i prompt.opus -ac 1 -ar 24000 prompt.wav
          rm prompt.opus

      - name: Clone with the gated model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HOME: ${{ runner.temp }}/hf-gated
        run: python measure.py clone out

      - name: Load the states into the open model (no token)
        env:
          HF_HOME: ${{ runner.temp }}/hf-open
        run: python measure.py portable out

      - name: Encrypt results
        if: always()
        run: |
          rm -f prompt.wav
          tar -czf - out states 2>/dev/null | age -r "$AGE_RECIPIENT" -o results.tar.gz.age
          ls -la results.tar.gz.age

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: pocket-tts-results-encrypted
          path: spike/pocket-tts/results.tar.gz.age
          retention-days: 3
